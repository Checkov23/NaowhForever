name: elsewhere-pages

# On demand: reads Wowhead Forever's page of every class, dungeon and battleground quest whose giver
# has no spot in our data yet, with Tools/build/elsewhere_quests.py, builds the Quest List's data
# and opens a pull request with it. Wowhead is read one page at a time at completo_quests.py's pace,
# and the first page that fails stops the reading. The pages read are kept in
# Tools/data/completo_quests.json as they come, so a run cut short still brings what it read, and
# the next run starts where it stopped.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: elsewhere-pages
  cancel-in-progress: false

jobs:
  pages:
    name: pages
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Stopped short of the job's own limit, so the pages read so far are kept and built from.
      - name: Read the quest pages from Wowhead
        run: |
          timeout 320m python Tools/build/elsewhere_quests.py \
            || echo "::warning::Cut short (exit $?), building from the pages read so far."

      - name: Build the Quest List's data
        run: python Tools/build/completo_quests.py --offline

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if git diff --quiet; then
            echo "Nothing new from Wowhead."
            exit 0
          fi
          branch=elsewhere-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -qam "feat(discovery): pin the class, dungeon and battleground quests whose givers had no spot"
          gh auth setup-git
          git push --force origin "HEAD:refs/heads/$branch"
          {
            echo "## What does this PR do?"
            echo
            echo "The Quest List's class, dungeon and battleground quests whose quest givers had no spot in our data,"
            echo "placed from their Wowhead Forever pages by the elsewhere-pages workflow."
            echo
            echo "## Changelog"
            echo
            echo "Added: Discovery > Quest List: more class, dungeon and battleground quests show on the world map at their quest givers."
            echo
            echo "---"
            echo "Opened by .github/workflows/elsewhere-pages.yml: $SERVER/$REPO/actions/runs/$RUN_ID."
            echo "Checks do not run on a pull request a workflow opens: close and reopen it to run them."
          } > "$RUNNER_TEMP/pr.md"
          pr="$(gh pr list --head "$branch" --state open --json url --jq '.[0].url // empty')"
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --body-file "$RUNNER_TEMP/pr.md"
            echo "Brought up to date: $pr"
          else
            gh pr create --base main --head "$branch" \
              --title "feat(discovery): pin the class, dungeon and battleground quests whose givers had no spot" \
              --body-file "$RUNNER_TEMP/pr.md" \
              || echo "::warning::Could not open the pull request: $SERVER/$REPO/compare/main...$branch?quick_pull=1"
          fi
